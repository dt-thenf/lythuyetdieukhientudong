name: Build LaTeX PDF

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Commit generated PDF as dt-thenf
        run: |
          git config user.name "paotroudz"
          git config user.email "81815344+dt-thenf@users.noreply.github.com"
          git add main.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged; nothing to commit."
          else
            git commit -m "build: update compiled PDF"
            git push
          fi
